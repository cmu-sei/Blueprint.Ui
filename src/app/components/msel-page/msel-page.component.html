<div class="article-container background">
  <div class="page">
    @if (banner(); as marking) {
      <app-marking-banner [banner]="marking" />
    }
    <angular-editor
      [placeholder]="'Description'"
      [(ngModel)]="mselPage.content"
      [config]="viewConfig"
    />
    @if (banner(); as marking) {
      <app-marking-banner [banner]="marking" />
    }
  </div>
</div>
