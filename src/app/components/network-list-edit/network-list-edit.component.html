<div class="networks">
  <p class="networks-label">Networks</p>
  @for (network of rows(); track $index; let i = $index) {
    <div class="network-row">
      <mat-form-field class="network-name">
        <mat-label>Network Name</mat-label>
        <input
          matInput
          type="text"
          [ngModel]="network.name"
          (blur)="change(i, 'name', $any($event.target).value)"
          placeholder="bank-lan"
          title="The network's name; with Caster, the name of a network in the template"
          required
        />
      </mat-form-field>
      <mat-form-field class="network-range">
        <mat-label>Range</mat-label>
        <input
          matInput
          type="text"
          [ngModel]="network.range"
          (blur)="change(i, 'range', $any($event.target).value)"
          placeholder="10.20.0.0/24"
          title="The network's address range in CIDR notation"
        />
      </mat-form-field>
      <mat-form-field class="network-purpose">
        <mat-label>Purpose</mat-label>
        <input
          matInput
          type="text"
          [ngModel]="network.purpose"
          (blur)="change(i, 'purpose', $any($event.target).value)"
          placeholder="Office LAN"
          title="What the network is for"
        />
      </mat-form-field>
      <mat-form-field class="network-hosts">
        <mat-label>Hosts</mat-label>
        <input
          matInput
          type="number"
          min="0"
          [ngModel]="network.hostCount"
          (blur)="change(i, 'hostCount', $any($event.target).value)"
          title="How many hosts are on the network"
        />
      </mat-form-field>
      <button
        mat-icon-button
        type="button"
        (click)="remove(i)"
        [attr.aria-label]="'Remove network ' + (network.name || i + 1)"
        title="Remove this network"
      >
        <mat-icon class="mdi-24px" fontIcon="mdi-delete" />
      </button>
    </div>
    @if (problem(network); as message) {
      <mat-error class="network-problem">{{ message }}</mat-error>
    }
  }
  <button mat-button type="button" (click)="add()" title="Add a network">
    <mat-icon fontIcon="mdi-plus-circle" />
    Add Network
  </button>
</div>
