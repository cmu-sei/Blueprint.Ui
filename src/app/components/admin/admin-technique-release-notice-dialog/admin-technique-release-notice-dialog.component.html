<crucible-dialog
  [dialogTitle]="'Edit Notice: ' + release.name + ' ' + release.version"
  [submitDisabled]="!errorFree()"
  [guardUnsavedWork]="true"
  (cancel)="handleEditComplete(false)"
  (submit)="handleEditComplete(true)"
>
  <div crucibleDialogContent>
    <div class="add-margin">
      <mat-form-field class="full-width">
        <mat-label>Source</mat-label>
        <input
          type="text"
          title="Who publishes the release (e.g. MITRE ATT&CK)"
          matInput
          placeholder="Source (e.g. MITRE ATT&CK)"
          [(ngModel)]="data.notice.source">
      </mat-form-field>
    </div>
    <div class="add-margin">
      <mat-form-field class="full-width">
        <mat-label>Source URL</mat-label>
        <input
          type="text"
          title="The publisher's website for the framework"
          matInput
          placeholder="https://"
          [(ngModel)]="data.notice.sourceUrl">
      </mat-form-field>
      @if (sourceUrlError) {
      <div class="url-error" role="alert">Enter an http or https address</div>
      }
    </div>
    <div class="add-margin">
      <mat-form-field class="full-width">
        <mat-label>Notice</mat-label>
        <textarea
          matInput
          rows="4"
          title="The copyright and trademark notice to show with the release's content"
          placeholder="Copyright and trademark notice"
          [(ngModel)]="data.notice.notice">
        </textarea>
        <mat-hint>One line per sentence group. Shown under the techniques of this release; leave blank to show none.</mat-hint>
      </mat-form-field>
    </div>
    <div class="add-margin">
      <mat-form-field class="full-width">
        <mat-label>Terms URL</mat-label>
        <input
          type="text"
          title="The publisher's terms of use"
          matInput
          placeholder="https://"
          [(ngModel)]="data.notice.termsUrl">
      </mat-form-field>
      @if (termsUrlError) {
      <div class="url-error" role="alert">Enter an http or https address</div>
      }
    </div>
  </div>
</crucible-dialog>
